<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>B.K. Motors | Dehradun</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f6f6f4;
  color:#111820;
}
a{text-decoration:none;color:inherit}

:root{
  --navy:#101b2d;
  --gold:#b08a50;
  --light:#f6f6f4;
  --grey:#69717d;
  --border:#e4e6e8;
}

.container{
  width:min(1180px,92%);
  margin:auto;
}

/* HEADER */
header{
  position:fixed;
  width:100%;
  top:0;
  z-index:100;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}

.nav{
  height:74px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:24px;
  font-weight:900;
  letter-spacing:-1px;
}

.logo span{color:var(--gold)}

.links{
  display:flex;
  align-items:center;
  gap:25px;
}

.links a{
  font-size:13px;
  font-weight:700;
  color:#3f4650;
}

.chat{
  background:var(--navy)!important;
  color:white!important;
  padding:12px 19px;
  border-radius:30px;
}

/* HERO */
.hero{
  min-height:760px;
  padding-top:74px;
  display:flex;
  align-items:center;
  background:
    radial-gradient(circle at 85% 35%,rgba(176,138,80,.16),transparent 30%),
    linear-gradient(135deg,#fff 0%,#f6f6f4 55%,#e9edf1 100%);
  position:relative;
  overflow:hidden;
}

.hero:after{
  content:"";
  position:absolute;
  width:420px;
  height:420px;
  border-radius:50%;
  border:1px solid rgba(176,138,80,.25);
  right:-120px;
  top:160px;
}

.hero-content{
  position:relative;
  z-index:2;
  max-width:720px;
}

.tag{
  color:var(--gold);
  font-weight:800;
  font-size:12px;
  letter-spacing:3px;
  margin-bottom:18px;
}

.hero h1{
  font-size:clamp(48px,8vw,88px);
  line-height:.94;
  letter-spacing:-5px;
}

.hero h1 span{color:var(--gold)}

.hero p{
  color:var(--grey);
  max-width:600px;
  font-size:17px;
  line-height:1.8;
  margin:25px 0;
}

.buttons{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.btn{
  display:inline-block;
  padding:15px 23px;
  border-radius:6px;
  font-size:13px;
  font-weight:800;
}

.dark{
  background:var(--navy);
  color:white;
}

.gold{
  background:var(--gold);
  color:white;
}

.outline{
  border:1px solid #cfd2d5;
  background:white;
}

/* HERO BIKE */
.hero-bike{
  position:absolute;
  right:5%;
  bottom:0;
  width:45%;
  max-width:600px;
  font-size:180px;
  text-align:center;
  filter:drop-shadow(0 30px 30px rgba(0,0,0,.15));
}

/* STRIP */
.strip{
  background:var(--navy);
  color:white;
  padding:25px 0;
}

.strip-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  text-align:center;
}

.strip-item{
  border-right:1px solid rgba(255,255,255,.15);
}

.strip-item:last-child{border:0}

.strip b{
  display:block;
  color:#d4b47e;
  font-size:25px;
}

.strip small{color:#aeb5bf}

/* SECTION */
section{padding:90px 0}

.heading{
  margin-bottom:38px;
}

.heading small{
  color:var(--gold);
  font-size:11px;
  font-weight:800;
  letter-spacing:3px;
}

.heading h2{
  font-size:43px;
  margin-top:7px;
  letter-spacing:-1.5px;
}

.heading p{
  color:var(--grey);
  margin-top:9px;
}

/* VEHICLES */
.vehicles{background:white}

.vehicle-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.vehicle{
  background:white;
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  transition:.25s;
}
