<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B.K. Motors Dehradun</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f7f7f5;
  color:#172235;
}

a{
  text-decoration:none;
}

.container{
  width:92%;
  max-width:1180px;
  margin:auto;
}

/* HEADER */

header{
  background:#ffffff;
  border-bottom:1px solid #e4e4e1;
  position:sticky;
  top:0;
  z-index:100;
}

.nav{
  min-height:75px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo-mark{
  width:44px;
  height:44px;
  background:#0b1b30;
  color:#d5b36a;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  border-radius:7px;
}

.logo-title{
  font-weight:900;
  color:#0b1b30;
  font-size:19px;
}

.logo-sub{
  color:#777;
  font-size:10px;
  letter-spacing:1.5px;
  margin-top:2px;
}

nav{
  display:flex;
  gap:24px;
  align-items:center;
}

nav a{
  color:#263346;
  font-size:13px;
  font-weight:700;
}

nav a:hover{
  color:#a17b3e;
}

.nav-btn{
  background:#0b1b30;
  color:white!important;
  padding:12px 17px;
  border-radius:5px;
}

/* HERO */

.hero{
  background:#0b1b30;
  color:white;
  min-height:570px;
  display:flex;
  align-items:center;
  position:relative;
  overflow:hidden;
}

.hero:after{
  content:"";
  position:absolute;
  right:-150px;
  top:-100px;
  width:520px;
  height:520px;
  border:1px solid rgba(213,179,106,.25);
  border-radius:50%;
}

.hero-content{
  position:relative;
  z-index:2;
  padding:70px 0;
}

.hero-label{
  color:#d5b36a;
  font-size:12px;
  font-weight:bold;
  letter-spacing:2px;
  text-transform:uppercase;
  margin-bottom:18px;
}

.hero h1{
  font-size:clamp(43px,7vw,75px);
  line-height:1;
  max-width:720px;
  letter-spacing:-2px;
}

.hero h1 span{
  color:#d5b36a;
}

.hero p{
  color:#cbd3dd;
  max-width:600px;
  margin-top:23px;
  font-size:16px;
  line-height:1.8;
}

.buttons{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:30px;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:14px 21px;
  border-radius:5px;
  font-size:13px;
  font-weight:800;
}

.btn-gold{
  background:#d5b36a;
  color:#101c2b;
}

.btn-white{
  border:1px solid #778292;
  color:white;
}

.btn-white:hover{
  background:white;
  color:#0b1b30;
}

.hero-stats{
  display:flex;
  flex-wrap:wrap;
  gap:30px;
  margin-top:35px;
}

.hero-stat strong{
  display:block;
  color:#d5b36a;
