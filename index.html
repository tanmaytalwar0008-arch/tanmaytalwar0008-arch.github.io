<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="BK Motors - Premium pre-owned bikes and scooters">
<title>BK Motors | Pre-Owned Two Wheelers</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f6f8;
    color:#161616;
}

a{
    text-decoration:none;
}

/* HEADER */

header{
    background:#080808;
    color:white;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 3px 20px rgba(0,0,0,.25);
}

.navbar{
    max-width:1200px;
    margin:auto;
    padding:17px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:1px;
}

.logo span{
    color:#e63946;
}

nav a{
    color:white;
    margin-left:22px;
    font-size:14px;
    font-weight:bold;
}

nav a:hover{
    color:#e63946;
}

/* HERO */

.hero{
    min-height:570px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:white;
    padding:70px 20px;

    background:
    linear-gradient(rgba(0,0,0,.72),rgba(0,0,0,.72)),
    url("https://images.unsplash.com/photo-1558981806-ec527fa84c39?auto=format&fit=crop&w=1800&q=85")
    center/cover;
}

.hero-content{
    max-width:850px;
}

.hero h1{
    font-size:58px;
    line-height:1.05;
    margin-bottom:18px;
}

.hero h1 span{
    color:#e63946;
}

.hero p{
    font-size:19px;
    line-height:1.65;
    color:#ddd;
    margin-bottom:28px;
}

.btn{
    display:inline-block;
    padding:14px 24px;
    border-radius:8px;
    font-weight:800;
    margin:5px;
    transition:.2s;
}

.btn-red{
    background:#e63946;
    color:white;
}

.btn-red:hover{
    background:#c92534;
    transform:translateY(-2px);
}

.btn-white{
    background:white;
    color:#111;
}

/* SEARCH */

.search-section{
    max-width:1150px;
    margin:-42px auto 15px;
    position:relative;
    z-index:10;
    padding:0 20px;
}

.search-box{
    background:white;
    border-radius:15px;
    padding:25px;
    box-shadow:0 10px 35px rgba(0,0,0,.12);
}

.search-box h2{
    margin-bottom:17px;
}

.filters{
    display:grid;
    grid-template-columns:2fr 1fr 1fr 1fr;
    gap:12px;
}

.filters input,
.filters select{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:14px;
    outline:none;
    background:white;
}

.filters input:focus,
.filters select:focus{
    border-color:#e63946;
}

.result-count{
    margin-top:12px;
    color:#777;
    font-size:14px;
}

/* GENERAL */

section{
    padding:65px 20px;
}

.container{
    max-width:1150px;
    margin:auto;
}

.section-title{
    text-align:center;
    margin-bottom:38px;
}

.section-title h2{
    font-size:35px;
    margin-bottom:10px;
}

.section-title p{
    color:#777;
}

/* BIKES */

.bikes-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
}

.bike-card{
    background:white;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    transition:.25s;
}

.bike-card:hover{
    transform:translateY(-6px);
    box-shadow:0 15px 35px rgba(0,0,0,.14);
}

.bike-image{
    height:235px;
    position:relative;
    overflow:hidden;
    background:#ddd;
}

.bike-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.4s;
}

.bike-card:hover .bike-image img{
    transform:scale(1.05);
}

.badge{
    position:absolute;
    top:14px;
    left:14px;
    background:#e63946;
    color:white;
    padding:7px 11px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.bike-info{
    padding:20px;
}

.bike-info h3{
    font-size:21px;
    margin-bottom:7px;
}

.price{
    font-size:23px;
    font-weight:900;
    color:#e63946;
    margin-bottom:14px;
}

.specs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:17px;
}

.spec{
    background:#f5f5f5;
    padding:9px;
    border-radius:6px;
    font-size:13px;
    color:#555;
}

.card-buttons{
    display:flex;
    gap:8px;
}

.card-buttons button{
    flex:1;
    padding:11px;
    border:0;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.details-btn{
    background:#111;
    color:white;
}

.enquiry-btn{
    background:#e63946;
    color:white;
}

/* ABOUT */

.about{
    background:#111;
    color:white;
}

.about-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:50px;
    align-items:center;
}

.about h2{
    font-size:36px;
    margin-bottom:18px;
}

.about p{
    color:#bbb;
    line-height:1.8;
}

.features{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.feature{
    border:1px solid #333;
    padding:20px;
    border-radius:10px;
    background:#181818;
}

.feature strong{
    display:block;
    margin-bottom:8px;
}

.feature span{
    color:#aaa;
    font-size:13px;
}

/* WHY US */

.why-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.why-card{
    background:white;
    text-align:center;
    padding:30px 20px;
    border-radius:12px;
    box-shadow:0 5px 18px rgba(0,0,0,.06);
}

.icon{
    font-size:35px;
    margin-bottom:13px;
}

/* ENQUIRY */

.enquiry{
    background:#eee;
}

.form-box{
    max-width:750px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:14px;
    box-shadow:0 5px 25px rgba(0,0,0,.08);
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.form-box input,
.form-box select,
.form-box textarea{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:7px;
    font-size:14px;
    margin-bottom:15px;
}

.form-box textarea{
    height:120px;
    resize:none;
}

.full{
    grid-column:1/-1;
}

.submit{
    width:100%;
    padding:15px;
    border:0;
    background:#e63946;
    color:white;
    border-radius:7px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

/* MAP */

.map-section{
    background:white;
}

.map{
    width:100%;
    height:400px;
    border:0;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}

/* CONTACT */

.contact-box{
    background:#111;
    color:white;
    border-radius:15px;
    padding:40px;
    text-align:center;
}

.contact-box h2{
    font-size:32px;
    margin-bottom:12px;
}

.contact-box p{
    color:#aaa;
    margin-bottom:20px;
}

.contact-buttons a{
    display:inline-block;
    padding:13px 22px;
    margin:5px;
    border-radius:7px;
    font-weight:bold;
}

.call{
    background:white;
    color:#111;
}

.whatsapp{
    background:#25D366;
    color:white;
}

/* FOOTER */

footer{
    background:#050505;
    color:#888;
    text-align:center;
    padding:25px;
    font-size:13px;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    z-index:2000;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-box{
    background:white;
    max-width:520px;
    width:100%;
    padding:30px;
    border-radius:15px;
    position:relative;
}

.close{
    position:absolute;
    right:18px;
    top:10px;
    font-size:30px;
    cursor:pointer;
    color:#555;
}

.modal-box h2{
    margin-bottom:15px;
}

.modal-box p{
    line-height:1.7;
    color:#555;
}

.modal-price{
    font-size:27px;
    color:#e63946;
    font-weight:bold;
    margin:15px 0;
}

/* NO RESULTS */

.no-results{
    display:none;
    text-align:center;
    padding:45px;
    background:white;
    border-radius:14px;
    color:#777;
}

/* MOBILE */

@media(max-width:900px){

    .hero h1{
        font-size:44px;
    }

    .filters{
        grid-template-columns:1fr 1fr;
    }

    .bikes-grid{
        grid-template-columns:1fr 1fr;
    }

    .why-grid{
        grid-template-columns:1fr 1fr;
    }
}

@media(max-width:650px){

    .navbar{
        padding:14px 16px;
    }

    nav{
        display:none;
    }

    .hero{
        min-height:510px
